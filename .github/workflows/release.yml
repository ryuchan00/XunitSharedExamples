name: Release

# v0.1.0 のようなタグを push すると、タグのバージョンでパッケージを作り nuget.org に公開する。
# nuget.org 側で Trusted Publishing のポリシー（このリポジトリと release.yml）を登録し、
# リポジトリの secret NUGET_USER に nuget.org のユーザー名を入れておく。

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack src/Xunit.SharedExamples --configuration Release --output artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --generate-notes --verify-tag
