name: Release

# Pushing a tag such as v0.1.0 builds the package at that version and publishes it to nuget.org.
# nuget.org must have a Trusted Publishing policy for this repository and release.yml, and the
# repository secret NUGET_USER must hold the nuget.org user name.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Xunit.SharedExamples/Xunit.SharedExamples.csproj)
          [ "v$version" = "$GITHUB_REF_NAME" ] ||
            { echo "::error::tag $GITHUB_REF_NAME does not match <Version>$version</Version>"; exit 1; }
      - name: Test
        run: bash .github/scripts/test.sh
      - name: Pack
        run: dotnet pack src/Xunit.SharedExamples --configuration Release --output artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --generate-notes --verify-tag
